Sitegeist.PaperTiger.CPX:Form:
  superTypes:
    Neos.Neos:Content: true
    Neos.Neos:ContentCollection: true
    Sitegeist.PaperTiger.CPX:Actions: true
  ui:
    label: i18n
    icon: 'wpforms'
    group: form.elements
    position: 10
    inlineEditable: true
    inspector:
      groups:
        'form':
          label: i18n
          position: 10
          icon: 'wpforms'
  properties:
    formMode:
      type: Sitegeist\PaperTiger\CPX\Components\Form\FormMode
      defaultValue: 'standard'
      ui:
        label: 'Form mode'
        reloadIfChanged: true
        inspector:
          group: 'form'
          position: 10
          editor: 'Neos.Neos/Inspector/Editors/SelectBoxEditor'
  postprocessors:
    enumFormMode:
      postprocessor: Vendor\Shared\Application\EnumProvider
      postprocessorOptions:
        enumName: Sitegeist\PaperTiger\CPX\Components\Form\FormMode
        propertyNames:
          - formMode    
  constraints:
    nodeTypes:
      '*': false
      'Sitegeist.PaperTiger.CPX:Field.Constraint': true
