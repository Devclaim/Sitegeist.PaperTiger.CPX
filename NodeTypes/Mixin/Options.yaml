Sitegeist.PaperTiger.CPX:Mixin.Options:
  abstract: true
  properties:
    options:
      type: array
      ui:
        label: i18n
        reloadIfChanged: true
        showInCreationDialog: false
        inspector:
          group: form
          editor: Sitegeist.InspectorGadget/Inspector/Editor
          editorOptions:
            isCollection: true
            isSortable: true
            # class does not exit ¯\_(ツ)_/¯
            itemType: Sitegeist\PaperTiger\Domain\OptionSpecification
            labels:
              addItem: 'Sitegeist.PaperTiger.CPX:Main:option.addItem'
