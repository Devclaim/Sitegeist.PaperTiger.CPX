Sitegeist.PaperTiger.CPX:Actions.Old:
  abstract: true
  ui:
    inspector:
      groups:
        'actions-message':
          label: 'Sitegeist.PaperTiger.CPX:NodeTypes.Action:groups.message'
          position: 20
          icon: 'commenting-o'
          tab: default
        'actions-email':
          label: 'Sitegeist.PaperTiger.CPX:NodeTypes.Action:groups.email'
          position: 30
          icon: 'icon-envelope-o'
          tab: default
      views:
        messageActionEditor:
          label: 'Sitegeist.PaperTiger.CPX:NodeTypes.Action.Message:views.messageActionEditor.label'
          group: actions-message
          position: end
          view: 'Sitegeist.PaperTiger.CPX/Inspector/Views/MessageActionEditor'
  properties:
    actionType:
      type: string
      defaultValue: 'message'
      ui:
        label: 'Sitegeist.PaperTiger.CPX:NodeTypes.Action:properties.actionType'
        reloadIfChanged: true
        inspector:
          group: 'actions-message'
          position: 'start'
          editor: 'Neos.Neos/Inspector/Editors/SelectBoxEditor'
          editorOptions:
            values:
              message:
                label: 'Sitegeist.PaperTiger.CPX:NodeTypes.Action:properties.actionType.values.message'
              redirect:
                label: 'Sitegeist.PaperTiger.CPX:NodeTypes.Action:properties.actionType.values.redirect'
    message:
      type: string
      ui:
        inlineEditable: true
        inline:
          editorOptions:
            placeholder: 'Sitegeist.PaperTiger.CPX:NodeTypes.Action.Message:properties.messagePlaceholder'
            autoparagraph: true
            paperTigerFieldTokens:
              enabled: true
            linking:
              anchor: true
              title: true
              relNofollow: true
              targetBlank: true
            formatting:
              strong: true
              em: true
              underline: true
              p: true
              ol: true
              ul: true
              sub: true
              sup: true
              a: true
              h1: false
              h2: false
              h3: true
              h4: true
              h5: false
              h6: false
              table: false
              removeFormat: true
    emailAction:
      type: array
      defaultValue: []
      ui:
        label: 'Sitegeist.PaperTiger.CPX:NodeTypes.Action:builtInTypes.email'
        reloadIfChanged: true
        inspector:
          group: 'actions-email'
          position: 10
          editor: 'Sitegeist.PaperTiger.CPX/Inspector/Editors/EmailActionEditor'
    redirectAction:
      type: string
      ui:
        label: 'Sitegeist.PaperTiger.CPX:NodeTypes.Action:builtInTypes.redirect'
        reloadIfChanged: true
        inspector:
          hidden: 'ClientEval:node.properties.actionType !== "redirect"'
          group: 'actions-message'
          editor: 'Neos.Neos/Inspector/Editors/LinkEditor'
          editorOptions:
            linkTypes:
              Document:
                enabled: true
              Web:
                enabled: true
              Asset:
                enabled: false
              MailTo:
                enabled: false
              Phone:
                enabled: false
