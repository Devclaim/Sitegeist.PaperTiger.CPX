Sitegeist:
  PaperTiger:
    CPX:
      components: { }
      asyncValidation:
        ruleProviders: [ ]
      Altcha:
        secret: ''
  SchemeOnYou:
    documents:
      papertiger:
        name: papertiger
        classNames:
          - 'Sitegeist\PaperTiger\CPX\Controller\FormController'
      altcha:
        name: altcha
        classNames:
          - 'Sitegeist\PaperTiger\CPX\Controller\AltchaChallengeController'
Neos:
  Flow:
    mvc:
      routes:
        'Sitegeist.PaperTiger.CPX':
          position: 'before Neos.Neos'
    object:
      includeClasses:
        'Sitegeist.PaperTiger.CPX':
          - '.*'

  Neos:
    nodeTypes:
      groups:
        'form.elements':
          label: 'Sitegeist.PaperTiger.CPX:Main:nodeTypes.groups.form.elements'
          collapsed: false
        'form.special':
          label: 'Sitegeist.PaperTiger.CPX:Main:nodeTypes.groups.form.special'
          collapsed: false

    userInterface:
      translation:
        autoInclude:
          Sitegeist.PaperTiger.CPX:
            - Main
            - 'NodeTypes/*'

    Ui:
      resources:
        javascript:
          '@sitegeist/papertiger-editors':
            resource: 'resource://Sitegeist.PaperTiger.CPX/Public/Neos.Ui/Plugin.js'
