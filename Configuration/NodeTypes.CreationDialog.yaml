#
# Trim the node creation dialogs for the form node types down to the fields that
# actually need editor input (name / label / value).
#
# PackageFactory.OPGM's RequiredPropertyUiPropertyConfigurationEnhancer flags every
# non-nullable property without a default value with `ui.showInCreationDialog: true`.
# For properties whose default is reachable through DefaultPropertyValuesExtractor
# (own or trait constructor defaults) ObjectPropertyGraphMapper substitutes that default
# instead of null, so the dialog entry is redundant and can be suppressed.
#
# Properties WITHOUT a reachable default - name, label, value - deliberately keep their
# dialog entry: without it the mapper receives null and the constructor throws a TypeError.
#
# Loaded after NodeTypes/ and after the reflection-derived configuration, so it wins.
#
'Sitegeist.PaperTiger.CPX:Actions':
  properties:
    actionType:
      ui:
        showInCreationDialog: false

'Sitegeist.PaperTiger.CPX:Field.CheckBoxesFormField':
  properties:
    customErrorMessageEnabled:
      ui:
        showInCreationDialog: false
    isRequired:
      ui:
        showInCreationDialog: false
    requiredUseCustomMessage:
      ui:
        showInCreationDialog: false

