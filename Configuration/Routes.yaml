-
  name: 'PaperTiger Submit'
  uriPattern: 'papertiger/submit'
  defaults:
    '@package': 'Sitegeist.PaperTiger.CPX'
    '@subpackage': ''
    '@controller': 'Form'
    '@action': 'submit'
    '@format': 'json'
  httpMethods: ['POST']
-
  name:  'Altcha'
  uriPattern: 'altcha'
  defaults:
    '@package': 'Sitegeist.PaperTiger.CPX'
    '@subpackage': ''
    '@controller': 'AltchaChallenge'
    '@action': 'challenge'
    '@format': 'json'
  httpMethods: ['GET']
